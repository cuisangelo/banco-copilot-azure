[project]
name = "products-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bank-contracts", "fastapi>=0.115", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8", "httpx2"]

[tool.uv.sources]
bank-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/products_api"]
