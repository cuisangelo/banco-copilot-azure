[project]
name = "copilot-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "bank-contracts",
    "agent-framework-core==1.21.*",
    "agent-framework-openai",
    "mcp>=1.24,<2",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "pyjwt[crypto]",
    "azure-identity",
    "azure-search-documents",
    "azure-cosmos",
    "azure-monitor-opentelemetry",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio"]

[tool.uv.sources]
bank-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/copilot_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
