[project]
name = "mcp-bank"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bank-contracts", "mcp>=1.24,<2", "httpx>=0.27", "uvicorn>=0.32"]

[dependency-groups]
dev = ["pytest>=8", "respx>=0.22", "anyio>=4"]

[tool.uv.sources]
bank-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bank"]
