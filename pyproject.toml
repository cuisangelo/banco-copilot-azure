[project]
name = "banco-copilot-azure"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["bank-contracts"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*", "functions/*", "evals"]

[tool.uv.sources]
bank-contracts = { workspace = true }

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["."]
